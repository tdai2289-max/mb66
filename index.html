<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MB66 - Trang giới thiệu</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#fff;
}

.top{
    height:95px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.logo{
    font-size:48px;
    font-weight:bold;
    color:red;
}

.buttons{
    position:absolute;
    right:15%;
}

.btn{
    display:inline-block;
    padding:13px 28px;
    margin:5px;
    border-radius:7px;
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.register{
    background:#ff7300;
}

.login{
    background:#1976d2;
}

.menu{
    background:red;
    padding:22px;
    text-align:center;
}

.menu span{
    color:white;
    font-weight:bold;
    margin:0 15px;
}

.banner{
    max-width:1140px;
    margin:auto;
    min-height:360px;
    background:#f1f1f1;
    text-align:center;
    padding:75px 20px;
}

.banner h1{
    color:red;
    font-size:45px;
}

.bigbtn{
    display:inline-block;
    background:#ff7300;
    color:white;
    padding:18px 40px;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    margin-top:20px;
}

.notice{
    text-align:center;
    padding:15px;
    font-size:13px;
    color:#666;
}
</style>
</head>

<body>

<div class="top">

    <div class="logo">
        MB66
    </div>

    <div class="buttons">

        <a class="btn register"
           href="https://mbaac.cc?r=JGG9MO">
           ĐĂNG KÝ
        </a>

        <a class="btn login"
           href="https://mbaac.cc?r=JGG9MO">
           ĐĂNG NHẬP
        </a>

    </div>

</div>

<div class="menu">
    <span>MB66</span>
    <span>THỂ THAO</span>
    <span>CASINO</span>
    <span>BẮN CÁ</span>
    <span>KHUYẾN MÃI</span>
    <span>HƯỚNG DẪN</span>
</div>

<div class="banner">

    <h1>MB66</h1>

    <h2>TRANG GIỚI THIỆU</h2>

    <p>Nhấn nút bên dưới để truy cập trang đối tác.</p>

    <a class="bigbtn"
       href="https://mbaac.cc?r=JGG9MO">
       ĐĂNG KÝ NGAY
    </a>

</div>

<div class="notice">
    Trang giới thiệu độc lập. Khi bấm các nút, bạn sẽ được chuyển sang website khác.
</div>

</body>
</html>
